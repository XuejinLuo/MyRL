# Shared observation/control protocol. Task files override only differences.
env_id: ???
obs_mode: pointcloud
control_mode: pd_ee_delta_pose
render_mode: rgb_array
num_points: 1024
use_color: true
exec_steps: 2
exp_weight: 0.01
max_episode_steps: 300
workspace_bounds: [[-0.5, -0.5, 0.0], [0.5, 0.5, 0.5]]

# Legacy checkpoints without this field also use random sampling.
sampling:
  mode: random
  objects: []

# null honors legacy sampling.mode; task profiles may select a new representation.
observation:
  mode: null
