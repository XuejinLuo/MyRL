# Stage wiring; edit the shared control panel in config.yaml.
defaults:
  - config
  - algo: idql
  - _self_
stage: offline
run_name: ${experiment}_offline
output: ${paths.root}/offline
save_dir: ${output}
epochs: ${stages.offline.epochs}
batch_size: ${stages.offline.batch_size}
save_epoch: ${stages.offline.save_every}
ema_decay: 0.999
critic_warmup_epochs: ${stages.offline.critic_warmup_epochs}
algo:
  use_bc_only: ${stages.offline.use_bc_only}
