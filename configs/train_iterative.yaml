# Stage wiring; edit the shared control panel in config.yaml.
defaults:
  - config
  - algo: idql
  - _self_
stage: iterative
run_name: ${experiment}_iterative
output: ${paths.root}/iterative
save_dir: ${output}
epochs: ${stages.iterative.epochs}
batch_size: ${stages.iterative.batch_size}
save_epoch: ${stages.iterative.save_every}
ema_decay: 0.999
critic_warmup_epochs: ${stages.iterative.critic_warmup_epochs}
initial_ckpt: ${stages.iterative.initial_ckpt}
stats_path: ${stages.iterative.stats_path}
rounds: ${stages.iterative.rounds}
episodes_per_round: ${stages.iterative.episodes_per_round}
collect_seed_start: ${stages.iterative.collect_seed_start}
collect_sampler: ${stages.iterative.collect_sampler}
resume: ${stages.iterative.resume}
manifest: ${dataset.manifest}
weight_key: auto

# Opt-in fixed-budget experiments. Null preserves historical epoch training.
collect: true
updates_per_round: null
critic_warmup_updates: 10000
eval_every_updates: 2000
save_every_updates: 2000
log_every_updates: 1000
actor_sampling:
  mode: mixed
  demo_fraction: 0.5
  demo_sources: [demonstrations]
