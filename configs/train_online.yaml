# configs/train_online.yaml
defaults:
  - model: flow_3d
  - algo: pg
  - env: maniskill
  - _self_

run_name: "pg_finetune_flow_${env.env_id}"
seed: 42
device: "cuda"
epochs: 100
save_dir: "./outputs/online"
save_epoch: 10

algo:
  pretrained_ckpt: "/home/luo/MyRL/outputs/offline/idql_flow_chunk16_PullCubeTool_20260908_105144/checkpoints/idql_policy_ep60.pth"
  actor_lr: 1e-6
  critic_lr: 3e-4
  entropy_coef: 0.0  # fixed std -> constant conditional entropy
  steps_per_epoch: 1024
  update_epochs: 2
  exploration_std: 0.02  # normalized action units, not variance
  minibatch_size: 16  # ODE backward retains multiple backbone evaluations
  critic_warmup_epochs: 3
  target_kl: 0.02  # conditional Gaussian KL, summed over executed prefix
  anchor_coef: 1.0  # full-chunk mean MSE to frozen offline reference
  clip_ratio: 0.1
  max_grad_norm: 0.5
  logprob_tolerance: 0.001

wandb:
  enable: true
  project: "RL-100-Infra"
