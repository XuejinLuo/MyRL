defaults:
  - model: flow_3d
  - algo: pg
  - env: maniskill
  - _self_
run_name: "rl100_flow_ppo_${env.env_id}"
seed: 42
device: cuda
epochs: 100
batch_size: 128
save_dir: ./outputs/online
save_epoch: 5
resume: null
eval_only: false
quiet: false
eval:
  every: 5
  sampler: cps
  seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009]
wandb:
  enable: false
  project: RL-100-Infra
