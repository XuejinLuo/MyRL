# Stage wiring; edit the shared control panel in config.yaml.
defaults:
  - config
  - algo: pg
  - online_task: legacy
  - _self_
stage: online
run_name: ${experiment}_online
output: ${paths.root}/online
save_dir: ${output}
epochs: ${stages.online.epochs}
batch_size: ${stages.online.batch_size}
save_epoch: ${stages.online.save_every}
resume: ${stages.online.resume}
eval_only: false
quiet: false
online_rollout:
  backend: cpu
  num_envs: 1
online_training:
  total_env_steps: null  # absolute total including warmup and resumed steps
  eval_every_env_steps: null  # null preserves epoch-based evaluation
  target_success_rate: 0.95  # reporting target, never a guarantee or automatic stop
  keep_epoch_checkpoints: true
  eval_worker_retries: 1  # one fresh-process retry; persistent failure remains fatal
online_diagnostics:
  enabled: true  # false disables optional phase stats / traces, not episode summaries
  value_before_after: true
  task_phase_stats: true
  trace_max_episodes: 20
  trace_max_steps_per_episode: 300
