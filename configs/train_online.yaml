# Stage wiring; edit the shared control panel in config.yaml.
defaults:
  - config
  - algo: pg
  - _self_
stage: online
run_name: ${experiment}_online
output: ${paths.root}/online
save_dir: ${output}
epochs: ${stages.online.epochs}
batch_size: ${stages.online.batch_size}
save_epoch: ${stages.online.save_every}
resume: ${stages.online.resume}
eval_only: false
quiet: false
