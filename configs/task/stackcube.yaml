# Panda / pd_ee_delta_pose task profile.
env:
  env_id: StackCube-v1
  observation:
    mode: object_centric
    encoder_variant: points  # centers: visible-centroid + robot-state ablation
    # Opt in with +env.observation.state_skip=true; omitted keeps old checkpoints/configs compatible.
    objects:
      - {name: cubeA, role: manipulated, h5_id: 18, max_points: 256}
      - {name: cubeB, role: target, h5_id: 19, max_points: 256}
    context_points: 512
  # Retained global_object_budget baseline (selected via observation.mode).
  sampling:
    mode: object_budget
    objects:
      # H5 IDs from the supplied diagnostic script; verify for other datasets.
      - {name: cubeA, h5_id: 18, num_points: 256}
      - {name: cubeB, h5_id: 19, num_points: 256}
model:
  action_dim: 7
  state_dim: 16
